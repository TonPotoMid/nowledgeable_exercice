name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Test Python 3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Python version
        run: python --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -p "test*.py" -v
          else
            echo "No tests directory found. Running Python smoke test."
            python -c "print('Python CI smoke test: OK')"
          fi

      - name: Repository quick check
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Event:  ${{ github.event_name }}"
          echo "Files in repository root:"
          ls -la

  deploy:
    name: Deploy to Ubuntu server
    runs-on: ubuntu-latest
    needs: test-python
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 20.56.74.49
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: mkdir -p /home/ubuntu/ad

      - name: Copy project files to remote folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 20.56.74.49
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/home/ubuntu/ad"