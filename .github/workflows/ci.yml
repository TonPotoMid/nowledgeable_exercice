name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nowledgeablecli

jobs:
  unit-tests:
    name: Job 1 - Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test*.py" -t . -v

  e2e-tests:
    name: Job 2 - E2E tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image for testing
        run: docker build -t nowledgeablecli:e2e .

      - name: Start application container
        run: docker run -d --name app-e2e -p 8080:8080 nowledgeablecli:e2e

      - name: Wait for application to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Application is up"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          docker logs app-e2e
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cypress
        run: npm install

      - name: Run Cypress E2E tests
        run: npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:8080

      - name: Show application logs
        if: always()
        run: docker logs app-e2e

      - name: Stop application container
        if: always()
        run: docker rm -f app-e2e

  build-and-push:
    name: Job 3 - Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

  deploy:
    name: Job 4 - Deploy on Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy container on Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker pull ${{ env.DOCKERHUB_IMAGE }}:latest
            docker stop myapp || true
            docker rm myapp || true
            docker run -d \
              --name myapp \
              --restart unless-stopped \
              -p 80:8080 \
              ${{ env.DOCKERHUB_IMAGE }}:latest
            docker logout

      - name: Healthcheck via public IP
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://${{ secrets.AZURE_VM_HOST }}/health > /dev/null; then
              echo "Deployment healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck failed"
          exit 1
